services:
  backend:
    build: .
    container_name: documind-backend
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-liquid/lfm-2.5-2.6b:free}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.50}
    volumes:
      - ./documents:/app/documents
      - ./vectorstore:/app/vectorstore
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  frontend:
    build: .
    container_name: documind-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    restart: unless-stopped
